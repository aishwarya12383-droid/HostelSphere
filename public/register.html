<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HostelSphere | Register</title>

<link rel="stylesheet" href="css/register.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>



<div class="container">


<div class="left">


<div class="logo">

🏠 HostelSphere

</div>



<h1>

Smart Hostel Management

</h1>



<p>

Manage hostel life smarter,
reduce food waste,
and stay connected.

</p>



<div class="features">


<div class="feature">

<i class="fa-solid fa-leaf"></i>

Reduce Food Waste

</div>



<div class="feature">

<i class="fa-solid fa-utensils"></i>

Meal Booking

</div>



<div class="feature">

<i class="fa-solid fa-chart-line"></i>

Analytics

</div>



<div class="feature">

<i class="fa-solid fa-bell"></i>

Real Time Notices

</div>



<div class="feature">

<i class="fa-solid fa-user-shield"></i>

Admin Monitoring

</div>


</div>



</div>







<div class="right">


<div class="card">


<h2>

Create Account

</h2>



<p>

Student Registration

</p>





<form id="registerForm">



<input
type="text"
id="name"
placeholder="Full Name"
required>




<input
type="email"
id="email"
placeholder="College Email"
required>




<input
type="tel"
id="phone"
placeholder="Phone Number"
required>





<select id="department">

<option>ECE</option>
<option>CSE</option>
<option>EEE</option>
<option>MECH</option>
<option>CIVIL</option>

</select>






<select id="year">

<option>I Year</option>
<option>II Year</option>
<option>III Year</option>
<option>IV Year</option>

</select>






<input
type="password"
id="password"
placeholder="Password"
required>




<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>





<button type="submit">

Register

</button>




<div class="login">


Already have an account?


<a href="login.html">

Login

</a>


</div>





</form>



</div>



</div>


</div>



<script src="js/register.js"></script>

</body>
</html>
