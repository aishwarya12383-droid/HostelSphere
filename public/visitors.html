<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HostelSphere | Visitors</title>

<link rel="stylesheet" href="css/visitors.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="container">

<h1>👥 Visitor Request</h1>

<div class="card">

<input
id="visitorName"
type="text"
placeholder="Visitor Name">

<input
id="relation"
type="text"
placeholder="Relation">

<input
id="date"
type="date">

<input
id="time"
type="time">

<textarea
id="purpose"
placeholder="Purpose of Visit"></textarea>

<button onclick="submitVisitor()">
Submit Request
</button>

</div>

<h2>📋 My Visitor Requests</h2>

<div id="visitorList">

<p>No Visitor Requests Yet.</p>

</div>

</div>

<script src="js/visitors.js"></script>

</body>

</html>
